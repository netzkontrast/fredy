<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>wunderflats detail fixture</title></head><body><script id="data-hydrant" type="application/json">{"lang":"de","pageData":{"listing":{"_id":"65f4888a4e9304622d46f700","listingLanguages":["en","de"],"restrictions":{"onlyStudentsAllowed":false},"apartmentName":"Ground Level / Erdgeschoss","furnitureStandard":"MEDIUM","apartmentState":"RENOVATED","keysProvided":{"buildingEntrance":2,"apartmentEntrance":2,"basement":0,"mailbox":1,"generalKey":0,"otherKeys":0,"keylessAccess":false},"locationInBuilding":{"en":"Ground Level","de":"Erdgeschoss"},"groupId":"Agje3B_CMuuRCawsYIIfD","partOfGroup":false,"externalId":"Bucheckernweg, EG","title":{"en":"Spacious house with a large garden in the green Cologne-Brück, good connection to the airport, trade fair and city center","de":"Geräumige Haushälfte mit großem Garten im grünen Köln-Brück, Gute Anbindung an Flughafen, Messe und Innenstadt"},"descriptionV2":{"en":"The detached house is located in a very well-kept neighborhood and offers plenty of space for families or couples. The kitchen and living and dining area form a light-flooded unit, with direct access to the large terrace, which invites you to linger comfortably with a view of the garden. The large garden is another highlight of the house.\n\nThere are two bedrooms available: The first bedroom is equipped with a 180 cm bed. The second bedroom has two 90 cm beds. Both bedrooms have large windows that can also be darkened with built-in shutters for a good night's sleep. The house is rounded off by a spacious bathroom. In the basement of the house there is a tenant cellar and a laundry room with an individual washing machine.\n\nThe house is in an excellent location: on the quiet, affluent outskirts of Cologne, within walking distance of the tram stop (U1) to Cologne city center (15-20 minutes). The A4 motorway exit (Refrath) is just a few minutes away, which also means you have good connections to the A3 motorway.\n\nThe neighboring town of Refrath (Bergisch Gladbach) offers direct shopping opportunities and cafes/restaurants, as well as good schools and kindergartens.\n\nBehind the house is a horse farm, followed by a forest area that is ideal for walking and cycling.","de":"Das freistehende Haus liegt in einer sehr gepflegten Nachbarschaft und bietet viel Platz für Familien oder Paare. Küche und Wohn- und Essbereich bilden eine Licht durchflutete Einheit, mit direktem Zugang zur großen Terrasse, die zum gemütlichen Verweilen mit Blick auf den Garten einlädt. Der große Garten bildet einen weiteren Höhepunkt des Hauses.\n\nEs stehen zwei Schlafzimmer zur Verfügung: Das erste Schlafzimmer ist mit einem 180er Bett ausgestattet. Das zweite Schlafzimmer hat zwei 90er Betten. Beide Schlafzimmer verfügen über große Fenster, die zugleich mit eingebauten Rollladen für einen guten Schlaf verdunkelt werden können. Abgerundet wird das Haus durch ein geräumiges Badezimmer. Im Keller des Hauses steht ein Mieterkeller und eine Waschküche mit eigener Waschmaschine zur Verfügung.\n\nDas Haus befindet sich in ausgezeichneter Lage: am ruhigen, wohlhabenden Stadtrand von Köln mit zugleich fußläufiger Verbindung zur Straßenbahnhaltestelle (U1) ins Kölner Stadtzentrum (15-20 Min). In wenigen Minuten erreicht man die Autobahnauffahrt A4 (Refrath) und hat dadurch ebenfalls gute Anbindung an die Autobahn A3.\n\nDirekte Einkaufsmöglichkeiten und Cafes/Restaurants bietet das unmittelbar angrenzende Refrath (Bergisch Gladbach), ebenso wie gute Schulen und Kindergärten.\nHinter dem Haus grenzt ein Pferdehof an, anschließend folgt ein Waldgebiet, das zum Spazierengehen und Fahrradfahren einlädt."},"deposit":498000,"floor":0,"area":104,"price":249000,"currency":"EUR","rooms":3,"beds":4,"totalSingleBeds":2,"totalDoubleBeds":2,"additionalInformation":{"en":"","de":""},"accommodates":4,"minBookingDuration":1,"availableFrom":"2026-09-01T00:00:00.000Z","address":{"street":"Bucheckernweg","zipCode":"51109","
